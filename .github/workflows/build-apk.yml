name: Build Android APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab ("Run workflow" button).
on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.x'
          channel: 'stable'

      # Our zip ships only lib/ + pubspec.yaml + a manifest template —
      # the android/ platform folder is generated here, same as setup.bat
      # does locally.
      - name: Generate platform files (if not already present)
        run: |
          if [ ! -d "android/app" ]; then
            cp pubspec.yaml pubspec.yaml.bak
            cp -r lib lib_backup
            flutter create --org com.sofmebel --project-name call_tracking_app .
            cp pubspec.yaml.bak pubspec.yaml
            rm -rf lib
            cp -r lib_backup lib
            rm -rf lib_backup pubspec.yaml.bak
          fi
          cp android_manifest_template/AndroidManifest.xml android/app/src/main/AndroidManifest.xml

      - name: Install packages
        run: flutter pub get

      - name: Patch compileSdk to 36 (app module)
        run: |
          FILE="android/app/build.gradle.kts"
          [ -f "$FILE" ] || FILE="android/app/build.gradle"
          sed -i \
            -e 's/^\(\s*compileSdk\s*=\s*\).*$/\136/' \
            -e 's/^\(\s*compileSdkVersion\s\+\).*$/\136/' \
            "$FILE"

      # Some plugins (e.g. file_picker) ship their OWN build.gradle with a
      # hardcoded compileSdk that can be lower than what the app needs.
      # Patching the root project's build.gradle.kts to force this at
      # configuration time doesn't work on modern AGP — it refuses to
      # change compileSdk after it has already been read ("It is too late
      # to set compileSdk"). Instead, patch every plugin's build.gradle
      # file directly, on disk, in the pub cache, BEFORE Gradle ever reads
      # it — after `flutter pub get` has just downloaded them.
      - name: Patch compileSdk to 36 (cached plugin packages)
        run: |
          PUB_CACHE_DIR="${PUB_CACHE:-$HOME/.pub-cache}"
          echo "Scanning $PUB_CACHE_DIR for plugin build.gradle files..."
          find "$PUB_CACHE_DIR" -path "*/android/build.gradle*" -print 2>/dev/null | while IFS= read -r f; do
            sed -i -E \
              -e 's/(compileSdk[[:space:]]*=[[:space:]]*)[0-9]+/\136/' \
              -e 's/(compileSdkVersion[[:space:]]*\(?[[:space:]]*)[0-9]+/\136/' \
              "$f"
          done

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: call-tracking-app-release
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

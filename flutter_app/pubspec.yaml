name: call_tracking_app
description: Admin/worker phone-call tracking app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  socket_io_client: ^2.0.3+1
  shared_preferences: ^2.3.2
  provider: ^6.1.2
  flutter_phone_direct_caller: ^2.1.1
  phone_state: ^3.0.1
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
